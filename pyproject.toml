[project]
name = "broll-librarian"
version = "0.1.0"
description = "Searchable, auto-organised B-roll library backed by Google Drive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.40"]
drive = ["google-api-python-client>=2.130", "google-auth-oauthlib>=1.2"]
shots = ["scenedetect>=0.6.4", "opencv-python-headless>=4.9"]
embeddings-local = ["sentence-transformers>=3.0"]
web = ["fastapi>=0.111", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
broll = "broll.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
broll = ["db/*.sql", "web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
