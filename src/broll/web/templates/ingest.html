{% extends "base.html" %}
{% set active = 'ingest' %}
{% block title %}Ingest{% endblock %}
{% block content %}
<div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_360px]">
  <section class="space-y-4">
    <form id="upload-form" hx-post="/ingest/upload" hx-target="#queue" hx-encoding="multipart/form-data"
          hx-swap="outerHTML" class="rounded-lg border border-slate-200 bg-white p-6">
      <label id="dropzone" for="file-input"
             class="grid cursor-pointer place-items-center rounded-md border-2 border-dashed border-slate-300 px-6 py-14 text-center">
        <p class="text-sm font-medium">Drop video files here</p>
        <p class="mt-1 text-xs text-slate-400">or click to choose. They are copied into the workspace staging folder, then queued.</p>
        <input id="file-input" name="files" type="file" multiple accept="video/*" class="hidden">
      </label>
      <p id="file-summary" class="mt-3 text-xs text-slate-500"></p>
      <button type="submit" class="mt-3 rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">
        Queue uploads
      </button>
    </form>

    <form hx-post="/ingest/path" hx-target="#queue" hx-swap="outerHTML"
          class="rounded-lg border border-slate-200 bg-white p-6">
      <label class="block text-xs font-medium uppercase tracking-wide text-slate-400">Or index a folder in place</label>
      <div class="mt-2 flex gap-2">
        <input name="path" placeholder="/Users/you/Footage/2026" required
               class="flex-1 rounded-md border border-slate-300 px-3 py-2 text-sm">
        <button class="rounded-md border border-slate-300 px-4 py-2 text-sm hover:bg-slate-50">Queue folder</button>
      </div>
      <p class="mt-2 text-xs text-slate-400">Nothing in that folder is moved, copied or deleted.</p>
    </form>
  </section>

  <aside id="queue-wrapper">
    {% include "partials/queue.html" %}
  </aside>
</div>

<script>
  const dropzone = document.getElementById('dropzone');
  const input = document.getElementById('file-input');
  const summary = document.getElementById('file-summary');
  const describe = () => {
    summary.textContent = input.files.length
      ? `${input.files.length} file(s) ready to queue.` : '';
  };
  input.addEventListener('change', describe);
  ['dragenter', 'dragover'].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drop-active'); }));
  ['dragleave', 'drop'].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drop-active'); }));
  dropzone.addEventListener('drop', e => { input.files = e.dataTransfer.files; describe(); });
  document.body.addEventListener('htmx:afterRequest', e => {
    if (e.detail.elt.id === 'upload-form') { input.value = ''; describe(); }
  });
</script>
{% endblock %}
