# Example workspace config. The real one lives at
# ~/.broll/workspaces/<workspace-id>/config.yaml and is created by `broll init`.
# Secrets never appear here - see .env.example.

name: My B-Roll Library

provider:
  vision: gemini            # gemini | anthropic | openai | mock
  vision_model: gemini-2.5-flash
  text: null                # defaults to the vision provider
  text_model: null
  # What the model costs per call is mostly decided by these four (see README, "What it costs").
  thinking: minimal         # minimal | low | medium | high | default. Thinking is billed as output.
  media_resolution: low     # tokens per frame of a video shot: low 260 | medium 530 | high/default 1,080
  segment_media_resolution: low   # ...and per frame of the look through a clip
  photo_media_resolution: default # a photograph is one frame carrying all the evidence
  cache_prompt: true        # keep the vocabularies, brief and folder list in a Google cache (1 hour)

embedder:
  kind: local               # local embeddings keep search quality independent
  model: all-MiniLM-L6-v2   # of which vision provider you pay for
  dimensions: 384           # changing this requires `broll reembed`

taxonomy:
  min_clips_for_subfolder: 5   # the rule that stops the Drive tree exploding
  max_folders_per_level: 40    # beyond this the long tail is grouped under Other/
  other_folder_name: Other
  library_folder_name: _Library
  review_folder_name: _Needs Review
  filename_max_length: 100

ingest:
  max_run_usd: 15              # stop starting files when a run has really cost this much (0 = no cap)
  max_day_usd: 20              # ...or the last 24 hours have (the cap that also holds across a restart)
  max_job_usd: 0.25            # stop retrying one file that has already cost this much
  frames_per_shot: 3
  frame_max_edge: 768          # frames are downscaled before being sent anywhere
  thumbnail_max_edge: 640
  min_shot_length_s: 1.5
  min_average_shot_length_s: 2.0
  concurrency: 4
  drive_concurrency: 2         # Drive is far stricter than the AI APIs

transcript:
  words_per_minute: 150        # used to estimate timings for plain-text transcripts
  beat_min_s: 3.0
  beat_max_s: 15.0
  candidates_per_beat: 8
  suggestions_per_beat: 3
  sequence_fps: null           # null = modal fps of the suggested clips

drive_root_folder_id: null
drive_root_folder_name: B-Roll

# An NLE cannot link media from a Drive URL - it needs a local path. Point this
# at your Google Drive for Desktop mount or exports will import offline.
drive_local_mount_path: null
# e.g. /Users/you/Library/CloudStorage/GoogleDrive-you@example.com/My Drive

# Terms promoted from `broll vocab` land here and are treated as in-vocabulary.
vocabulary_overrides: {}
